[project]
name = "global-people-tracker-backend"
version = "0.0.0"
requires-python = ">=3.12,<3.13"

[tool.pyright]
include = ["app", "tests"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
